# Entorno local de PRUEBAS. Sin datos reales, sin exposición pública.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo_local_only
      POSTGRES_DB: postgres
    volumes:
      - db:/var/lib/postgresql/data
  odoo:
    image: odoo:19
    depends_on: [db]
    ports:
      - "127.0.0.1:8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo_local_only
    volumes:
      - ./addons:/mnt/extra-addons
      - odoo:/var/lib/odoo
volumes:
  db:
  odoo:
